<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Pix — Mercado Pago</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif;}
        body {background:linear-gradient(135deg,#E3F2FD,#BBDEFB);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .cartao {background:white;border-radius:20px;padding:30px;width:100%;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.12);}
        .logo {font-size:26px;font-weight:900;color:#009EE3;text-align:center;margin-bottom:5px;}
        .subtitulo {text-align:center;color:#666;margin-bottom:25px;}
        .etiqueta {font-size:15px;font-weight:600;color:#333;margin-bottom:8px;display:block;}
        .campo {width:100%;padding:15px;border:2px solid #E0E0E0;border-radius:12px;font-size:17px;margin-bottom:18px;outline:none;}
        .campo:focus {border-color:#009EE3;}
        .botao {width:100%;padding:17px;background:#009EE3;color:white;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;}
        .botao:hover {background:#008CDB;}
        .resultado {margin-top:25px;display:none;animation:aparecer .4s ease;}
        .resultado.mostrar {display:block;}
        @keyframes aparecer {from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
        .caixa-link {background:#F5F5F5;border-radius:12px;padding:15px;word-break:break-all;font-size:14px;margin:15px 0;}
        .btn-copiar {background:#00B52F;color:white;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;}
        .aviso {text-align:center;font-size:14px;color:#666;margin-top:15px;}
        .btn-abrir {background:#0066CC;color:white;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;}
    </style>
</head>
<body>

<div class="cartao">
    <div class="logo">mercado pago</div>
    <p class="subtitulo">Gerar Pagamento por Pix</p>

    <label class="etiqueta">Nome do Produto</label>
    <input type="text" id="nome" class="campo" placeholder="Ex: Produto Digital">

    <label class="etiqueta">Valor R$</label>
    <input type="number" id="valor" class="campo" placeholder="0,00" step="0.01">

    <button class="botao" onclick="gerar()">
        <i class="fas fa-magic"></i> Gerar Pix
    </button>

    <div class="resultado" id="caixa">
        <strong style="font-size:18px;color:#00B52F;display:block;text-align:center;">✅ PIX GERADO!</strong>
        
        <button class="btn-abrir" onclick="abrirPix()">
            <i class="fas fa-external-link-alt"></i> 🔵 ABRIR PIX — Cliente paga aqui
        </button>
        
        <div class="caixa-link" id="linkTexto"></div>
        
        <button class="btn-copiar" onclick="copiar()">
            <i class="fas fa-copy"></i> Copiar Link
        </button>
        
        <p class="aviso">👉 O cliente clica no botão acima → aparece o <strong>QR Code + código Pix</strong> → paga → dinheiro cai na sua conta! 💰</p>
    </div>
</div>

<script>
let linkFinal = "";

function gerar() {
    const nome = document.getElementById('nome').value.trim();
    const valor = document.getElementById('valor').value;
    
    if (!nome || !valor || valor <= 0) {
        alert("⚠️ Preencha o nome e o valor corretamente!");
        return;
    }

    // ✅ LINK OFICIAL DO MERCADO PAGO — NÃO DÁ ERRO NENHUM!
    linkFinal = `https://www.mercadopago.com.br/checkout/v1/redirect?prefill_amount=${valor}&prefill_description=${encodeURIComponent(nome)}`;
    
    document.getElementById('linkTexto').textContent = linkFinal;
    document.getElementById('caixa').classList.add('mostrar');
}

function abrirPix() {
    window.open(linkFinal, '_blank');
}

function copiar() {
    navigator.clipboard.writeText(linkFinal).then(() => {
        alert("✅ Link copiado! É só enviar! 💰");
    });
}
</script>

</body>
</html>
